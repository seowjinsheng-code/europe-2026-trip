<div class="route-days">
  <div class="day-block"><div class="day-label">18 OCT · 周日 · 抵达当天下午</div><div class="timeline"><div class="tl-time">视航班</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Heathrow 希思罗机场 → Westminster 酒店</b><span>Elizabeth line 伊丽莎白线 到一区 £15.50、约 35–45 分钟、每 12–15 分钟一班；行李多可 Heathrow Express（15 分钟到 Paddington，约 £25）。先寄存行李。</span><span class="leg">↳ 落地晚于 15:00：只做 Westminster 外观 + Covent Garden 柯芬园</span></div><div class="tl-time">~13:00</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Buckingham Palace 白金汉宫（外观）</b><span>免费。周日 10:00 有 Sunday Parade（非完整换岗）；穿 St James’s Park 圣詹姆斯公园 东行，秋色最好。</span><span class="leg">↳ 步行 12 分 · 0.9 km</span></div><div class="tl-time">14:00</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Parliament Square 议会广场 · Big Ben 大本钟 · Westminster Abbey 西敏寺</b><span>免费外观。Abbey 周日不对游客开放，只看外立面与 Dean’s Yard。</span><span class="leg">↳ 过 Westminster Bridge 威斯敏斯特桥 · 步行 8 分</span></div><div class="tl-time">15:00</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>South Bank 南岸 · London Eye 伦敦眼（外观）</b><span>免费。沿泰晤士河南岸走；摩天轮上舱 £29+（自选、可现场买）。</span><span class="leg">↳ 经 Golden Jubilee Bridge 金禧桥 回北岸 · 步行 15 分</span></div><div class="tl-time">16:30</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri rain">▢</span>Trafalgar Square 特拉法加广场 · National Gallery 国家美术馆</b><span>免费。广场必经；下雨或想歇脚进 National Gallery（周日 10:00–18:00）。</span><span class="leg">↳ 步行 10 分 · 0.7 km</span></div><div class="tl-time">17:30</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>黄昏 → Covent Garden 柯芬园</b><span>免费。17:57 日落；廊市、街头艺人，转入 Seven Dials 七晷广场 / Neal’s Yard 尼尔庭院。</span><span class="leg">↳ 步行 8 分到 Soho 苏活区</span></div><div class="tl-time">19:00</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Soho 苏活区 晚餐</b><span>餐厅见 P05，人均约 £20–35。周日晚部分店早关，建议订位。</span></div></div></div>

<div class="page-head"><div><span class="eyebrow">ZÜRICH · ROUTE · 25–26 OCT（周日–周一）</span><h1>第一天老城，第二天 <em>Uetliberg 于特利山</em></h1><p>这站不追求景点数量。两个硬约束：25 日周日商店全关、且当晚时钟拨回冬令时；26 日周一 Kunsthaus 与国家博物馆都闭馆——所以重心是户外、湖边、老城与那座山。</p></div></div>
<div class="route-facts">
  <div><b>≈4 + 3 km</b><span>两天步行 · 山上另计</span></div>
  <div><b>无必付门票</b><span>只有交通费</span></div>
  <div><b>17:10</b><span>日落 · 25 日起冬令时</span></div>
  <div><b>5–12°C</b><span>阴冷 · Uetliberg 山上更冷</span></div>
  <div><b>周日/周一</b><span>商店、美术馆多关门</span></div>
</div>
<div class="tl-legend"><span class="pri fix">● 固定</span><span class="pri opt">○ 想去再订</span><span class="pri rain">▢ 雨天备选</span></div>

<div class="route-days"><div class="day-block"><div class="day-label">25 OCT · 周日 · 抵达 + 冬令时</div><div class="timeline"><div class="tl-time">视航班</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Zürich Airport 苏黎世机场 → HB</b><span>火车 10–13 分钟、每几分钟一班；ZVV 单程或 24h 票。今晚 03:00 时钟拨回 1 小时——多睡 1 小时，但之后天黑更早。</span><span class="leg">↳ 先到酒店寄存</span></div><div class="tl-time">14:30</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Bahnhofstrasse（只当林荫道走）</b><span>周日商店全关，不用进店；一路走到湖边。</span><span class="leg">↳ 步行 10 分</span></div><div class="tl-time">15:00</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Lindenhof 林登霍夫高地</b><span>免费高地，看老城与利马特河。</span><span class="leg">↳ 步行 8 分</span></div><div class="tl-time">15:40</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Grossmünster 大教堂 / Fraumünster 圣母大教堂 / 利马特河岸</b><span>Grossmünster 可登塔（约 CHF 5）；Fraumünster 的 Chagall 彩窗值得进（小额门票）。</span><span class="leg">↳ 步行 10 分</span></div><div class="tl-time">16:45</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Bürkliplatz 比尔克利广场 / 苏黎世湖</b><span>黄昏（约 17:10 日落），然后进 Niederdorf 老城巷子。</span><span class="leg">↳ 步行 5 分到 Niederdorf 尼德多夫老城</span></div><div class="tl-time">18:30</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri opt">○</span>Niederdorf 晚餐</b><span>fondue / rösti（餐厅见 P12）。</span></div></div></div><div class="day-block"><div class="day-label">26 OCT · 周一 · 整天（注意闭馆）</div><div class="timeline"><div class="tl-time">08:30</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Uetliberg（天气决定）</b><span>S10 从 HB 约 20 分钟（周一每 30 分钟一班）。晴天 / föhn 有阿尔卑斯全景，可走 Planetenweg 到 Felsenegg 再缆车下山。阴雨直接跳过。</span><span class="leg">↳ S10 回 HB · 山上比市区低 5–8°C</span></div><div class="tl-time">12:00</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>老城午餐</b><span>不赶。</span><span class="leg">↳ 步行</span></div><div class="tl-time">13:30</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>二选一：湖上游船 / Lindt Home of Chocolate 瑞士莲巧克力天堂</b><span>周一 Kunsthaus 与国家博物馆都闭馆。Lindt（Kilchberg，每日 10:00–18:00、约 CHF 15）或苏黎世湖 ZSG 游船（10 月末转冬季班次，先查时刻）。</span><span class="leg">↳ 电车 7 号 / 短程火车</span></div><div class="tl-time">阴雨</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri rain">▢</span>Lindt 室内 / Niederdorf 拱廊 / Café 长坐</b><span>Zürich 周一室内选择本就少，别硬排。</span></div><div class="tl-time">16:30</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>提早收尾 + 打包</b><span>27 日 EuroCity 去 Milan，行李与车票今晚弄好；17:10 天黑。</span></div></div></div></div>
<div class="ops-strip"><div><b>机场 & 市内交通</b><span>机场↔HB 火车 10–13 分钟。市内 ZVV：1–2 区 24h 票约 CHF 9.40；Uetliberg 需覆盖到 154 区。Zürich 什么都能刷卡。</span><a class="cta tertiary" href="https://www.zvv.ch/en/travelcards-and-tickets/tickets/24h-tickets.html" target="_blank" rel="noopener noreferrer">ZVV 24h<span>↗</span></a></div><div><b>周日/周一现实</b><span>25 日商店全关（超市在 HB / 机场有例外）；26 日主要美术馆闭馆。重心放户外：Uetliberg、湖、Lindenhof、Grossmünster、Niederdorf。</span></div><div><b>27 日 → Milan</b><span>SBB EuroCity 直达约 3h20，Supersaver 约 CHF 38 起——必须提前锁的后半程骨架（见 P12）。</span><a class="cta tertiary" href="https://www.sbb.ch/en/leisure-holidays/europe/countries-cities/italy/zurich-milan.html" target="_blank" rel="noopener noreferrer">SBB<span>↗</span></a></div></div>

<div class="route-days"><div class="day-block"><div class="day-label">27 OCT · 周二 · 短停（+ 28 日上午）</div><div class="timeline"><div class="tl-time">~12:40</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Milano Centrale 米兰中央车站</b><span>寄存 / check‑in，只带小包出门。</span><span class="leg">↳ M3 黄线 2 站到 Duomo · 7 分钟</span></div><div class="tl-time">14:00</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Duomo di Milano 米兰大教堂</b><span>教堂 + 屋顶露台 + 博物馆：Combo 步行 €22 / 电梯 €26。屋顶是重点，趁 17:15 日落前的光上去。约 2 小时。</span><span class="leg">↳ 步行 2 分</span></div><div class="tl-time">16:15</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Galleria Vittorio Emanuele II 埃马努埃莱二世拱廊</b><span>同一广场，免费、开到很晚；穿过去就是 Scala 广场。</span><span class="leg">↳ 步行 12 分</span></div><div class="tl-time">17:00</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Brera</b><span>画派区窄巷、书店、aperitivo；此时天已黑（17:15 日落）。</span><span class="leg">↳ 步行 / 电车</span></div><div class="tl-time">19:30</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri opt">○</span>晚餐：Brera 或 Navigli 运河区</b><span>Navigli 运河区更热闹，电车约 20 分（餐厅见 P14）。</span></div><div class="tl-time">28 日上午</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri opt">○</span>Castello Sforzesco 中庭</b><span>去 Rome 高铁前有富余才加，中庭免费、开放早。</span><span class="leg">↳ 绝不要拖到影响 Milan→Rome 班次</span></div></div></div><div class="card soft"><div class="section-title"><span>DUOMO</span><h2>怎么选票</h2></div><p>只有 1 晚，直接买 <b>Combo</b>（教堂 + 屋顶 + 博物馆）：走楼梯 €22 / 电梯 €26。单买屋顶电梯 €18 / 楼梯 €16，但没必要拆开。官网 duomomilano.it 订。</p><a class="cta primary" href="https://www.duomomilano.it/en/" target="_blank" rel="noopener noreferrer">Duomo 官方<span>↗</span></a><div class="note-box">《最后的晚餐》(Cenacolo 《最后的晚餐》) 周二开放，但要提前数周订；没订到就放弃，不值得为它打乱这半天。</div><div class="note-box">28 日不要让 Castello 影响 Milan → Rome 高铁——后半程准点比多一个景点重要。</div></div></div>

<div class="page-head"><div><span class="eyebrow">MILAN · STAY / FOOD / TRANSFER</span><h1>住 Centrale 是为了第二天无脑上车</h1></div></div>

</a></div></div></div></div>
<div class="grid g3 compact"><div class="card"><b>市内交通</b><p>ATM 2026：90分钟 €2.20；24h €7.60。短停通常单程 / contactless 就够。</p><a class="cta secondary" href="https://www.atm.it/en/ViaggiaConNoi/Biglietti/Pages/HowtogetaroundMilanbypublictransport.aspx" target="_blank" rel="noopener noreferrer">ATM Milano<span>↗</span></a></div><div class="card"><b>Milan → Rome</b><p>Italo 最快约2h52；参考票价 €29.90 起。优先选择 Milano Centrale 米兰中央车站 → Roma Termini 特米尼车站。</p><a class="cta primary" href="https://www.italotreno.com/en/destinations-timetable/milan-rome-tickets" target="_blank" rel="noopener noreferrer">Italo 官方<span>↗</span></a></div><div class="card budget-card"><div class="card-title"><span class="icon">◎</span><div><b>每人预算参考</b><small>2人同行、双人房分摊</small></div></div><div class="budget-row"><span>住宿分摊</span><b>EUR 80–115</b></div><div class="budget-row"><span>餐饮</span><b>EUR 45–70</b></div><div class="budget-row"><span>市内交通</span><b>EUR 8–15</b></div><div class="budget-row"><span>Duomo 大教堂</span><b>EUR 18–26</b></div><div class="budget-total"><span>规划总额</span><strong>EUR 151–226</strong></div><div class="micro">住宿为规划区间，不是实时房价 · checked 29 Aug 2026</div></div></div>

<div class="page-head"><div><span class="eyebrow">ROME 罗马 · ARRIVAL NIGHT · 28 OCT（周三）</span><h1>第一晚只走 <em>Centro Storico 历史中心</em></h1><p>从 Milan 米兰 的高铁约 3 小时到 Termini 特米尼车站。不碰 Colosseum 罗马斗兽场 / Vatican 梵蒂冈——那是接下来两个整天的事。今晚就是一段夜景步行，晚到也不影响核心计划。</p></div></div>
<div class="route-facts">
  <div><b>≈2.5 km</b><span>四个点的夜间步行</span></div>
  <div><b>€0 今晚</b><span>Pantheon 万神殿 内部留到白天</span></div>
  <div><b>17:02</b><span>日落 · 全程夜景</span></div>
  <div><b>12–20°C</b><span>温和 · 偶有阵雨</span></div>
  <div><b>防扒</b><span>Termini 特米尼 / Trevi 特雷维 夜里最多</span></div>
</div>

<div class="route-days"><div class="day-block"><div class="day-label">28 OCT · 周三 · 夜间</div><div class="timeline"><div class="tl-time">到酒店后</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Termini 特米尼 / Monti 蒙蒂区 放行李</b><span>免费。只带小包，现金与卡分开放。Milan 高铁若晚点，这段就是轻松夜间步行。</span><span class="leg">↳ 步行进 Centro Storico 历史中心</span></div><div class="tl-time">18:00</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Trevi Fountain 特雷维喷泉</b><span>免费。夜里打光最好看，但人多、扒手多——包抱在身前。</span><span class="leg">↳ 步行 10 分 · 0.7 km</span></div><div class="tl-time">18:30</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Spanish Steps 西班牙台阶</b><span>免费。台阶不能久坐（会被罚），拍完就走。</span><span class="leg">↳ 步行 12 分 · 0.9 km</span></div><div class="tl-time">19:15</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Pantheon 万神殿（外观）</b><span>Piazza della Rotonda 圆形广场 上看正立面；内部 €7（每日 09:00–19:00、末入 18:30，周末/旺季需预约），留到白天。</span><span class="leg">↳ 步行 4 分</span></div><div class="tl-time">19:45</div><div class="tl-dot"></div><div class="tl-copy"><b><span class="pri fix">●</span>Piazza Navona 纳沃纳广场</b><span>免费。Bernini 贝尼尼 四河喷泉，围广场找晚餐（餐厅见 P17）。</span></div></div></div><div class="card soft"><div class="section-title"><span>OPTION</span><h2>Pantheon / 雨天</h2></div><p>Pantheon 内部 2026 全票 €7（7/1 起；此前 €5）。抵达时间不稳定，不要为进去而锁不可退的晚时段——白天顺路再进。</p><a class="cta tertiary" href="https://direzionemuseiroma.cultura.gov.it/en/pantheon/" target="_blank" rel="noopener noreferrer">Pantheon 官方<span>↗</span></a><div class="note-box">Milan 高铁延误 / 下雨：收缩成 Trevi → Pantheon → Piazza Navona 三点，Spanish Steps 删。</div></div></div>

<div class="page-head"><div><span class="eyebrow">ROME 罗马 · 29–30 OCT（周四–五）</span><h1>Colosseum 罗马斗兽场 · Vatican 梵蒂冈：<em>两个整天</em>，不再硬赶</h1><p>多住 1 晚，把古罗马和梵蒂冈拆成两个完整的日子。29 日（周四）古罗马；30 日（周五）梵蒂冈，当晚从 FCO 菲乌米奇诺机场 飞回，31 日到 Singapore 新加坡。两张主票（Colosseum €18 + Vatican ≈€25）出发前必须订好。</p></div></div>
<div class="route-facts">
  <div><b>≈5 + 4 km</b><span>两天步行 · 台阶多</span></div>
  <div><b>€18 + €25</b><span>Colosseum + Vatican 门票</span></div>
  <div><b>16:58 / 16:55</b><span>日落 · 外景排午后早段</span></div>
  <div><b>末入 15:30</b><span>Colosseum 冬季硬卡点</span></div>
  <div><b>12–20°C</b><span>温和 · 穿好走的鞋</span></div>
</div>
<div class="tl-legend"><span class="pri fix">● 固定</span><span class="pri opt">○ 想去再订</span><span class="pri rain">▢ 雨天备选</span></div>
<div class="route-top"><div class="map-card"><div id="map-rome2" class="leaflet-map route-map" data-map="rome2"><div class="map-fallback">地图加载中…</div></div><div class="map-actions"><span class="route-key" style="--key:#173e69">Day 1 · 古罗马</span><span class="route-key" style="--key:#66704a">Day 2 · 梵蒂冈 + 回程</span><a class="cta primary" href="https://www.google.com/maps/dir/?api=1&origin=Colosseum%20Rome&destination=Trastevere%20Rome&waypoints=Roman%20Forum%20Rome%7CPalatine%20Hill%20Rome%7CCapitoline%20Museums%20Rome%7CPiazza%20Venezia%20Rome&travelmode=walking" target="_blank" rel="noopener noreferrer">Day 1 古罗马<span>↗</span></a><a class="cta secondary" href="https://www.google.com/maps/dir/?api=1&origin=Vatican%20Museums&destination=Roma%20Termini&waypoints=St%20Peter%27s%20Basilica%7CCastel%20Sant%27Angelo%20Rome&travelmode=walking" target="_blank" rel="noopener noreferrer">Day 2 梵蒂冈<span>↗</span></a></div></div><div class="route-photo-single"><figure class="photo-card"><button class="photo-zoom" aria-label="放大图片" onclick="openLightbox(this.nextElementSibling.src, this.nextElementSibling.alt)">＋</button><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Colosseum%20Rome.jpg?width=1500" alt="Colosseum 罗马斗兽场" loading="lazy" style="object-position:center" onerror="imageFallback(this)"><figcaption><b>Rome 罗马 · Colosseum 罗马斗兽场</b><a href="https://commons.wikimedia.org/wiki/File:Colosseum_Rome.jpg" target="_blank" rel="noopener noreferrer">图片来源</a></figcaption></figure></div></div>

`,quick:[]},{id:'p22-tools-budget',section:'Master',title:'Money・eSIM・Apps・Packing・总预算',eyebrow:'把旅行运行所需工具一次备好',html:`
<div class="page-head"><div><span class="eyebrow">MASTER · TRAVEL OPS</span><h1>真正会在路上用到的工具</h1></div></div>
<div class="grid g4 ops-grid"><div class="card"><h2>支付</h2><ul class="check-list"><li>主力信用卡 / debit</li><li>Apple Pay / Google Pay</li><li>第二张卡分开保存</li><li>GBP / EUR / CHF 小额现金</li></ul></div><div class="card"><h2>手机</h2><ul class="check-list"><li>eSIM / roaming</li><li>Google Maps 离线地图</li><li>航空 / 铁路 App</li><li>酒店与票务截图</li></ul></div><div class="card"><h2>行李</h2><ul class="check-list"><li>轻量防雨外套</li><li>好走的鞋</li><li>万能转换插头</li><li>移动电源</li><li>小型防盗包</li></ul></div><div class="card"><h2>文件</h2><ul class="check-list"><li>护照扫描件</li><li>保险</li><li>酒店确认</li><li>跨城车票</li><li>门票订单</li></ul></div></div>
<div class="grid g2"><div class="card"><div class="section-title"><span>BUDGET</span><h2>每人预算（14 天 · 不含国际机票）</h2></div><div class="budget-row"><span>欧洲跨城交通（3 程廉航 + 2 程火车）</span><b>S$400–600</b></div><div class="budget-row"><span>住宿分摊（12 晚 · 双人房 ÷2）</span><b>S$1,500–2,200</b></div><div class="budget-row"><span>餐饮（14 天）</span><b>S$700–1,000</b></div><div class="budget-row"><span>门票 + 市内交通</span><b>S$400–700</b></div><div class="budget-row"><span>eSIM / 杂项 / 缓冲</span><b>S$150–250</b></div><div class="budget-total"><span>合计 / 人</span><strong>≈ S$3,300</strong></div><div class="micro">精打细算 ≈ S$3,300；好酒店 + 内部景点全进约 S$4,200。不含新加坡⇄欧洲国际往返机票、购物。</div></div><div class="card"><div class="section-title"><span>QUICK LINKS</span><h2>常用入口</h2></div><div class="quick-grid"><a class="cta primary" href="https://www.google.com/maps" target="_blank" rel="noopener noreferrer">Google Maps<span>↗</span></a><a class="cta secondary" href="https://www.google.com/travel/flights" target="_blank" rel="noopener noreferrer">Google Flights<span>↗</span></a><a class="cta secondary" href="https://www.booking.com/" target="_blank" rel="noopener noreferrer">Booking.com<span>↗</span></a><a class="cta secondary" href="https://www.xe.com/" target="_blank" rel="noopener noreferrer">XE Currency<span>↗</span></a><a class="cta secondary" href="https://www.accuweather.com/" target="_blank" rel="noopener noreferrer">Weather<span>↗</span></a></div><div class="note-box">把这页加入手机主屏幕或收藏夹。真正出发后，你最常打开的是 Maps、交通、票务和酒店确认，不是景点介绍。</div></div></div>
<div class="section-title top-gap"><span>逐城费用</span><h2>每一站的预估花费（每人 · S$）</h2></div>
<div class="table-wrap"><table><thead><tr><th>行程段</th><th>晚</th><th>住宿</th><th>餐饮</th><th>门票 + 市内</th><th>→ 下一站交通</th><th>小计 / 人</th></tr></thead><tbody>
<tr><td>London 伦敦</td><td>3</td><td>S$390</td><td>S$200</td><td>S$100（War Rooms + 交通）</td><td>S$80（→ Barcelona 巴塞罗那）</td><td><b>≈ S$770</b></td></tr>
<tr><td>Barcelona 巴塞罗那</td><td>2</td><td>S$245</td><td>S$120</td><td>S$75（圣家堂 + 桂尔公园 + 地铁）</td><td>S$65（→ Nice 尼斯）</td><td><b>≈ S$505</b></td></tr>
<tr><td>Nice 尼斯 · Monaco 摩纳哥</td><td>2</td><td>S$205</td><td>S$130</td><td>S$60（海洋博物馆 + TER + tram）</td><td>S$85（→ Zürich 苏黎世）</td><td><b>≈ S$480</b></td></tr>
<tr><td>Zürich 苏黎世</td><td>2</td><td>S$280</td><td>S$160</td><td>S$40（ZVV + 于特利山）</td><td>S$55（→ Milan 米兰，EuroCity 早鸟）</td><td><b>≈ S$535</b></td></tr>
<tr><td>Milan 米兰</td><td>1</td><td>S$110</td><td>S$60</td><td>S$45（米兰大教堂 Combo + 地铁）</td><td>S$45（→ Rome 罗马，高铁早鸟）</td><td><b>≈ S$260</b></td></tr>
<tr><td>Rome 罗马</td><td>3</td><td>S$370</td><td>S$200</td><td>S$95（斗兽场 + 梵蒂冈 + ATAC + Leonardo Express）</td><td>—（国际航班另计）</td><td><b>≈ S$665</b></td></tr>
<tr><td>eSIM · 杂项 · 缓冲</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td><b>≈ S$180</b></td></tr>
<tr><td><b>合计 / 人</b></td><td><b>13 晚</b></td><td colspan="4"></td><td><b>≈ S$3,395</b></td></tr>
</tbody></table></div>
<div class="micro">逐城为「精打细算」中位估算：省钱酒店（如 hub by Premier Inn）+ 只进核心门票（War Rooms / 圣家堂+桂尔 / 海洋博物馆 / 米兰大教堂 / 斗兽场+梵蒂冈），非全部内部。想每个内部都进，全程约 +S$700–900。汇率参考 €1≈S$1.45 · £1≈S$1.7 · CHF1≈S$1.55（以付款日为准）。</div>

  applyEdits();

  /* ---------- serialize a rendered page back to an html string ---------- */
  function serialize(pageEl) {
    var c = pageEl.cloneNode(true);
    c.querySelectorAll('.page-stamp,.ed-ui').forEach(function (e) { e.remove(); });
    c.querySelectorAll('[contenteditable]').forEach(function (e) { e.removeAttribute('contenteditable'); });
    c.querySelectorAll('.leaflet-map').forEach(function (e) {
      e.className = e.className.replace(/\s*leaflet-container[\w-]*/g, '').replace(/\s*no-tiles/g, '').trim();
      e.removeAttribute('style'); e.removeAttribute('tabindex'); e._mapInit = false;
      e.innerHTML = '<div class="map-fallback">地图加载中…</div>';
    });
    return c.innerHTML.trim();
  }
  function commit(i) {
    var pel = A.book.children[i];
    var html = serialize(pel);
    A.pages[i].html = html;
    EDITS[A.pages[i].id] = html;
    writeLS();
  }
  var commitTimer = null;
  function commitSoon(i) { clearTimeout(commitTimer); commitTimer = setTimeout(function () { commit(i); }, 250); }

  /* ---------- edit toggle ---------- */
  function setEditing(on) {
    editing = on == null ? !editing : !!on;
    document.body.classList.toggle('editing', editing);
    var t = document.getElementById('editToggle');
    if (t) { t.textContent = editing ? '完成编辑' : '编辑'; t.classList.toggle('primary', editing); }
    if (editing) { if (!panel) buildPanel(); panel.hidden = false; syncPanel(); }
    else { if (panel) panel.hidden = true; setDevFrame(0); }
  }
  function wireToggle() { var t = document.getElementById('editToggle'); if (t && !t._w) { t._w = 1; t.onclick = function () { setEditing(); }; } }
  wireToggle();
  document.addEventListener('DOMContentLoaded', wireToggle);
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'E' || e.key === 'e')) { e.preventDefault(); setEditing(); }
  });
  new MutationObserver(function () { if (editing) syncPanel(); })
    .observe(document.getElementById('currentTitle'), { childList: true, characterData: true, subtree: true });

  /* ---------- panel shell ---------- */
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function field(label, value, oninput, opts) {
    opts = opts || {};
    var w = el('label', 'ed-f');
    w.appendChild(el('span', 'ed-l', label));
    var inp = document.createElement(opts.area ? 'textarea' : (opts.sel ? 'select' : 'input'));
    if (opts.sel) { opts.sel.forEach(function (o) { var op = el('option', null, o[1]); op.value = o[0]; inp.appendChild(op); }); inp.value = value || ''; }
    else { inp.value = value == null ? '' : value; }
    if (opts.area) inp.rows = opts.rows || 2;
    if (opts.ph) inp.placeholder = opts.ph;
    inp.addEventListener('input', function () { oninput(inp.value, inp); });
    w.appendChild(inp);
    return w;
  }
  function btn(txt, fn, cls) { var b = el('button', 'ed-b' + (cls ? ' ' + cls : ''), txt); b.type = 'button'; b.onclick = fn; return b; }

  function buildPanel() {
    panel = el('aside', 'ed-panel'); panel.id = 'edPanel';
    var h = el('div', 'ed-head');
    h.appendChild(el('strong', null, '内容编辑'));
    var dev = el('div', 'ed-dev');
    var bPC = btn('💻 电脑', function () { setDevFrame(0); mark(); }, 'on');
    var bMB = btn('📱 手机', function () { setDevFrame(390); mark(); });
    function mark() { bPC.classList.toggle('on', !devW); bMB.classList.toggle('on', !!devW); }
    dev.appendChild(bPC); dev.appendChild(bMB);
    h.appendChild(dev);
    h.appendChild(btn('×', function () { setEditing(false); }, 'x'));
    panel.appendChild(h);

    var bar = el('div', 'ed-bar');
    bar.appendChild(btn('导出 HTML', exportHTML, 'pri'));
    bar.appendChild(btn('导出 JSON', exportJSON));
    var imp = btn('导入 JSON', function () { fi.click(); });
    var fi = document.createElement('input'); fi.type = 'file'; fi.accept = '.json,application/json'; fi.style.display = 'none';
    fi.onchange = function () { var f = fi.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { importJSON(r.result); }; r.readAsText(f); };
    bar.appendChild(imp); bar.appendChild(fi);
    bar.appendChild(btn('恢复默认', function () { if (confirm('清空所有草稿、恢复到文件原始内容？')) { localStorage.removeItem(KEY); location.reload(); } }, 'warn'));
    panel.appendChild(bar);

    panel.appendChild(el('div', 'ed-count', '未改动')).id = 'edCount';

    var gr = el('details', 'ed-sec'); gr.innerHTML = '<summary>全局查找 / 替换（改日期、价格最快）</summary>';
    var gwrap = el('div', 'ed-gr');
    var f1 = document.createElement('input'), f2 = document.createElement('input');
    f1.placeholder = '查找，如 19:00'; f2.placeholder = '替换为，如 18:30';
    gwrap.appendChild(f1); gwrap.appendChild(f2);
    gwrap.appendChild(btn('全部替换', function () {
      var a = f1.value; if (!a) return;
      var cnt = 0;
      A.pages.forEach(function (p, i) {
        if (p.html.indexOf(a) >= 0) { p.html = p.html.split(a).join(f2.value); EDITS[p.id] = p.html; cnt += 1; }
      });
      writeLS(); rerenderAll(); syncPanel();
      alert('已在 ' + cnt + ' 页替换。');
    }, 'pri'));
    gr.appendChild(gwrap); panel.appendChild(gr);

    var body = el('div', 'ed-body'); body.id = 'edBody'; panel.appendChild(body);
    document.body.appendChild(panel);
  }

  /* ---------- panel content for the current page ---------- */
  function txt(node) { return node ? node.textContent.trim() : ''; }
  function setText(node, v) { if (node) node.textContent = v; }
  function firstLink(scope) { return scope ? scope.querySelector('a[href]') : null; }

  function sec(title) { var d = el('div', 'ed-g'); if (title) d.appendChild(el('div', 'ed-gt', title)); return d; }

  function syncPanel() {
    if (!panel) return;
    var i = A.index, p = A.pages[i], pe = A.book.children[i];
    if (!pe) return;
    var B = document.getElementById('edBody'); B.innerHTML = '';
    B.appendChild(el('div', 'ed-page', (i + 1) + ' / ' + A.pages.length + ' · ' + p.section));

    // page meta
    var g0 = sec('页面');
    g0.appendChild(field('目录标题', p.title, function (v) {
      p.title = v; A.toc.innerHTML = '<div class="toc-title">目录 · ' + A.pages.length + ' Pages</div>'; A.buildToc(); A.render();
      EDITS['_meta'] = EDITS['_meta'] || {}; // marker; titles are re-baked on export via A.pages
    }));
    B.appendChild(g0);

    // eyebrow / h1 / lead
    var head = pe.querySelector('.page-head');
    if (head) {
      var g1 = sec('页头');
      var eb = head.querySelector('.eyebrow');
      if (eb) g1.appendChild(field('眉标', txt(eb), function (v) { setText(eb, v); commitSoon(i); }));
      var h1 = head.querySelector('h1');
      if (h1) g1.appendChild(field('大标题（<em>…</em> 可标红重点）', h1.innerHTML.trim(), function (v) { h1.innerHTML = v; commitSoon(i); }, { area: 1, rows: 2 }));
      var lead = head.querySelector('p');
      if (lead) g1.appendChild(field('导语', txt(lead), function (v) { setText(lead, v); commitSoon(i); }, { area: 1, rows: 3 }));
      B.appendChild(g1);
    }

    // route-facts
    var rf = pe.querySelector('.route-facts');
    if (rf) {
      var g2 = sec('速览条（5 格）');
      rf.querySelectorAll(':scope > div').forEach(function (d, k) {
        var b = d.querySelector('b'), s = d.querySelector('span');
        var row = el('div', 'ed-row2');
        row.appendChild(field('值 ' + (k + 1), txt(b), function (v) { setText(b, v); commitSoon(i); }));
        row.appendChild(field('说明', txt(s), function (v) { setText(s, v); commitSoon(i); }));
        g2.appendChild(row);
      });
      B.appendChild(g2);
    }

    // day-labels + timelines
    pe.querySelectorAll('.day-block').forEach(function (db) {
      var lab = db.querySelector('.day-label');
      var tl = db.querySelector('.timeline');
      var g = sec('时间轴' + (lab ? '：' + txt(lab) : ''));
      if (lab) g.appendChild(field('日期标签', txt(lab), function (v) { setText(lab, v); commitSoon(i); }));
      if (tl) buildTimeline(g, tl, i);
      B.appendChild(g);
    });
    pe.querySelectorAll('.timeline').forEach(function (tl) {
      if (tl.closest('.day-block')) return;
      var g = sec('时间轴');
      buildTimeline(g, tl, i);
      B.appendChild(g);
    });

    // ops cards
    var ops = pe.querySelectorAll('.ops-strip');
    if (ops.length) {
      var g3 = sec('要点卡片');
      ops.forEach(function (strip) {
        strip.querySelectorAll(':scope > div').forEach(function (d) {
          var b = d.querySelector('b'), s = d.querySelector('span'), a = firstLink(d);
          var card = el('div', 'ed-card');
          card.appendChild(field('标题', txt(b), function (v) { setText(b, v); commitSoon(i); }));
          card.appendChild(field('正文', txt(s), function (v) { setText(s, v); commitSoon(i); }, { area: 1, rows: 3 }));
          if (a) card.appendChild(field('链接 URL', a.getAttribute('href'), function (v) { a.setAttribute('href', v); commitSoon(i); }));
          g3.appendChild(card);
        });
      });
      B.appendChild(g3);
    }

    // reco / ticket / budget rows (stay·food·master pages)
    var recos = pe.querySelectorAll('.reco, .ticket');
    if (recos.length) {
      var g4 = sec('条目（住宿 / 餐饮 / 票务）');
      recos.forEach(function (rc) {
        var b = rc.querySelector('b'), s = rc.querySelector('span'), sm = rc.querySelector('small'), a = firstLink(rc);
        var card = el('div', 'ed-card');
        card.appendChild(field('名称', txt(b), function (v) { setText(b, v); commitSoon(i); }));
        if (s) card.appendChild(field('说明', txt(s), function (v) { setText(s, v); commitSoon(i); }));
        if (sm) card.appendChild(field('小字 / 价格', txt(sm), function (v) { setText(sm, v); commitSoon(i); }));
        if (a) card.appendChild(field('链接 URL', a.getAttribute('href'), function (v) { a.setAttribute('href', v); commitSoon(i); }));
        g4.appendChild(card);
      });
      B.appendChild(g4);
    }
    var brows = pe.querySelectorAll('.budget-row, .budget-total');
    if (brows.length) {
      var g5 = sec('预算行');
      brows.forEach(function (br) {
        var sp = br.querySelector('span'), amt = br.querySelector('b, strong');
        var row = el('div', 'ed-row2');
        row.appendChild(field('项目', txt(sp), function (v) { setText(sp, v); commitSoon(i); }));
        row.appendChild(field('金额', txt(amt), function (v) { setText(amt, v); commitSoon(i); }));
        g5.appendChild(row);
      });
      B.appendChild(g5);
    }

    // tables
    pe.querySelectorAll('table').forEach(function (tb, ti) {
      var g6 = sec('表格 ' + (ti + 1));
      tb.querySelectorAll('tbody tr').forEach(function (tr, ri) {
        var cell = el('div', 'ed-card');
        cell.appendChild(el('div', 'ed-gt', '行 ' + (ri + 1)));
        tr.querySelectorAll('td').forEach(function (td, ci) {
          var a = td.querySelector('a[href]');
          var textNode = null;
          for (var x = 0; x < td.childNodes.length; x++) { if (td.childNodes[x].nodeType === 3 && td.childNodes[x].textContent.trim()) { textNode = td.childNodes[x]; break; } }
          var cur = textNode ? textNode.textContent.trim() : (a ? '' : td.textContent.trim());
          cell.appendChild(field('列 ' + (ci + 1), cur, function (v) {
            if (textNode) textNode.textContent = v;
            else if (!a) td.textContent = v;
            else { td.insertBefore(document.createTextNode(v), td.firstChild); }
            commitSoon(i);
          }));
          if (a) cell.appendChild(field('列 ' + (ci + 1) + ' 链接', a.getAttribute('href'), function (v) { a.setAttribute('href', v); commitSoon(i); }));
        });
        g6.appendChild(cell);
      });
      B.appendChild(g6);
    });

    // leftover prose
    var seen = new Set();
    pe.querySelectorAll('.page-head, .route-facts, .ops-strip, .timeline, .reco, .ticket, table, .tl-legend').forEach(function (n) { n.querySelectorAll('*').forEach(function (x) { seen.add(x); }); seen.add(n); });
    var extra = [];
    pe.querySelectorAll('h2, p, li, .callout, .note-box, .info-strip, .final-banner, figcaption b').forEach(function (n) {
      if (seen.has(n)) return; if (!n.textContent.trim()) return; if (n.closest('.ed-ui')) return;
      extra.push(n);
    });
    if (extra.length) {
      var g7 = sec('其他文字');
      extra.forEach(function (n, k) {
        g7.appendChild(field(n.tagName.toLowerCase() + ' ' + (k + 1), n.textContent.trim(), function (v) { n.textContent = v; commitSoon(i); }, { area: n.textContent.length > 40, rows: 2 }));
      });
      B.appendChild(g7);
    }
  }

  /* ---------- timeline stop editor ---------- */
  function stopParts(tl) {
    // returns array of {time,dot,copy}
    var kids = Array.prototype.slice.call(tl.children);
    var out = [], cur = null;
    kids.forEach(function (k) {
      if (k.classList.contains('tl-time')) { cur = { time: k }; out.push(cur); }
      else if (k.classList.contains('tl-dot')) { if (cur) cur.dot = k; }
      else if (k.classList.contains('tl-copy')) { if (cur) cur.copy = k; }
    });
    return out.filter(function (s) { return s.time && s.copy; });
  }
  function buildTimeline(g, tl, i) {
    var stops = stopParts(tl);
    stops.forEach(function (s, si) {
      var card = el('div', 'ed-card');
      var hd = el('div', 'ed-sthead');
      hd.appendChild(el('span', null, '第 ' + (si + 1) + ' 站'));
      var tools = el('span', 'ed-tools');
      tools.appendChild(btn('↑', function () { moveStop(tl, si, -1, i); }));
      tools.appendChild(btn('↓', function () { moveStop(tl, si, 1, i); }));
      tools.appendChild(btn('＋', function () { addStop(tl, si, i); }));
      tools.appendChild(btn('🗑', function () { delStop(tl, si, i); }, 'warn'));
      hd.appendChild(tools);
      card.appendChild(hd);

      var b = s.copy.querySelector('b');
      var pri = b ? b.querySelector('.pri') : null;
      var desc = null, leg = null;
      s.copy.querySelectorAll('span').forEach(function (sp) { if (sp.classList.contains('leg')) leg = sp; else if (sp.classList.contains('pri')) {} else if (!desc) desc = sp; });

      card.appendChild(field('时间', txt(s.time), function (v) { setText(s.time, v); commitSoon(i); }));
      card.appendChild(field('优先级', pri ? (pri.classList.contains('fix') ? 'fix' : pri.classList.contains('opt') ? 'opt' : pri.classList.contains('rain') ? 'rain' : '') : '', function (v) {
        setPri(b, v); commitSoon(i);
      }, { sel: [['', '（无）'], ['fix', '● 固定'], ['opt', '○ 想去再订'], ['rain', '▢ 雨天备选']] }));
      card.appendChild(field('名称', nameOf(b), function (v) { setName(b, v); commitSoon(i); }));
      if (desc) card.appendChild(field('说明', txt(desc), function (v) { setText(desc, v); commitSoon(i); }, { area: 1, rows: 3 }));
      else card.appendChild(field('说明', '', function (v) { var sp = document.createElement('span'); sp.textContent = v; s.copy.appendChild(sp); commitSoon(i); }, { area: 1, rows: 2, ph: '（原本没有说明，输入即新增）' }));
      card.appendChild(field('衔接 / 距离（↳ …）', leg ? txt(leg).replace(/^↳\s*/, '') : '', function (v) {
        if (!v && leg) { leg.remove(); }
        else { if (!leg) { leg = document.createElement('span'); leg.className = 'leg'; s.copy.appendChild(leg); } leg.textContent = '↳ ' + v; }
        commitSoon(i);
      }));
      g.appendChild(card);
    });
    var addLast = btn('＋ 在末尾加一站', function () { addStop(tl, stops.length - 1, i, true); }, 'pri wide');
    g.appendChild(addLast);
  }
  function nameOf(b) {
    if (!b) return '';
    var t = '';
    b.childNodes.forEach(function (n) { if (n.nodeType === 3) t += n.textContent; });
    return t.trim();
  }
  function setName(b, v) {
    if (!b) return;
    var pri = b.querySelector('.pri');
    b.innerHTML = '';
    if (pri) b.appendChild(pri);
    b.appendChild(document.createTextNode(v));
  }
  function setPri(b, v) {
    if (!b) return;
    var pri = b.querySelector('.pri');
    if (!v) { if (pri) pri.remove(); return; }
    var glyph = v === 'fix' ? '●' : v === 'opt' ? '○' : '▢';
    if (!pri) { pri = document.createElement('span'); b.insertBefore(pri, b.firstChild); }
    pri.className = 'pri ' + v; pri.textContent = glyph;
  }
  function moveStop(tl, si, dir, i) {
    var s = stopParts(tl), a = s[si], b = s[si + dir];
    if (!a || !b) return;
    var nodesA = [a.time, a.dot, a.copy].filter(Boolean);
    var ref = dir > 0 ? (b.copy.nextSibling) : b.time;
    nodesA.forEach(function (n) { tl.insertBefore(n, ref); });
    commit(i); syncPanel();
  }
  function addStop(tl, si, i, atEnd) {
    var s = stopParts(tl);
    var base = s[si] || s[s.length - 1];
    var t = el('div', 'tl-time', '时间');
    var d = el('div', 'tl-dot');
    var c = el('div', 'tl-copy');
    c.innerHTML = '<b><span class="pri fix">●</span>新站点</b><span>说明</span>';
    var ref = base ? (atEnd ? null : (base.copy.nextSibling)) : null;
    if (ref) { tl.insertBefore(t, ref); tl.insertBefore(d, ref); tl.insertBefore(c, ref); }
    else { tl.appendChild(t); tl.appendChild(d); tl.appendChild(c); }
    commit(i); syncPanel();
  }
  function delStop(tl, si, i) {
    var s = stopParts(tl), a = s[si];
    if (!a) return;
    if (!confirm('删除第 ' + (si + 1) + ' 站？')) return;
    [a.time, a.dot, a.copy].forEach(function (n) { if (n) n.remove(); });
    commit(i); syncPanel();
  }

  /* ---------- device preview frame ---------- */
  function setDevFrame(w) {
    devW = w;
    teardownDevFrame();
    if (!w) return;
    var host = el('div', 'ed-frameHost'); host.id = 'edFrameHost';
    var ph = el('div', 'ed-phone');
    var f = document.createElement('iframe'); f.id = 'edFrame';
    f.src = location.pathname + '?preview=1' + location.hash;
    ph.appendChild(f); host.appendChild(ph);
    var toolbar = el('div', 'ed-frbar');
    toolbar.appendChild(btn('刷新预览', refreshFrame));
    host.appendChild(toolbar);
    A.viewer.appendChild(host);
  }
  function teardownDevFrame() { var h = document.getElementById('edFrameHost'); if (h) h.remove(); }
  function refreshFrame() { var f = document.getElementById('edFrame'); if (f) f.src = location.pathname + '?preview=1' + location.hash + '&t=' + Date.now(); }
  function scheduleFrameRefresh() { if (!devW) return; clearTimeout(frameTimer); frameTimer = setTimeout(refreshFrame, 900); }

  /* ---------- export / import ---------- */
  function pagesLiteral() {
    return 'const pages=' + JSON.stringify(A.pages.map(function (p) {
      return { id: p.id, section: p.section, title: p.title, eyebrow: p.eyebrow || '', html: p.html, quick: p.quick || [] };
    }));
  }
  function dl(text, name, type) {
    var b = new Blob([text], { type: type });
    var u = URL.createObjectURL(b);
    var a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 1500);
  }
  function exportJSON() { dl(JSON.stringify(EDITS, null, 1), 'europe-2026-edits.json', 'application/json'); }
  function importJSON(str) {
    try {
      var obj = JSON.parse(str);
      EDITS = obj || {};
      writeLS();
      A.pages.forEach(function (p) { if (EDITS[p.id] != null) p.html = EDITS[p.id]; });
      rerenderAll(); syncPanel();
      alert('已导入。');
    } catch (e) { alert('JSON 解析失败：' + e.message); }
  }
  function exportHTML() {
    fetch(location.pathname, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (src) {
      var a = src.indexOf('const pages=[');
      var mk = src.indexOf('const mapData=', a);
      var end = src.lastIndexOf('];', mk);
      if (a < 0 || mk < 0 || end < 0) { alert('无法定位内容块。请改用「导出 JSON」。'); return; }
      var out = src.slice(0, a) + pagesLiteral() + ';\n' + src.slice(end + 2);
      dl(out, 'index.html', 'text/html');
      alert('已生成 index.html —— 把它上传/替换到 GitHub 仓库即可正式生效。');
    }).catch(function () {
      alert('读取源文件失败（多半是用 file:// 本地打开）。\n请把文件放到 GitHub Pages 后再「导出 HTML」，\n或先用「导出 JSON」备份。');
    });
  }
})();

</script>
<style>
/* 行程条微调：统一高度、不折行 */
.trip-spine{align-items:stretch;gap:6px}
.trip-node{min-width:104px;display:flex;flex-direction:column;justify-content:center;padding:10px 12px}
.trip-node span{margin:3px 0;white-space:nowrap;font-size:12px}
.trip-node small{white-space:nowrap;font-size:9.5px;line-height:1.3}
.trip-spine i{align-self:center;flex:0 0 auto}
/* 图片说明：加中文后自动换行、不再被压扁（卡片高度不变，图片自适应） */
.photo-card{display:flex;flex-direction:column}
.photo-card img{height:auto!important;flex:1 1 auto;min-height:0}
.photo-card figcaption{height:auto;min-height:28px;align-items:center;padding:5px 9px;gap:8px;line-height:1.2}
.photo-card figcaption b{font-size:9.5px;line-height:1.2;flex:1 1 auto}
.photo-card figcaption a{flex:0 0 auto;white-space:nowrap}
/* 封面页脚：允许换行，页码不被挤 */
.cover-foot{flex-wrap:wrap;gap:2px 10px;font-size:10px}
.cover-foot span:last-child{margin-left:auto;flex:0 0 auto}
</style>
</body></html>
